name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev \
            appstream desktop-file-utils

      # Not apt's rclone: Ubuntu 24.04 has 1.60, and FastSync refuses anything below MIN_RCLONE (1.76), so the
      # real-rclone tests would panic. Keep the version in step with MIN_RCLONE in crates/core/src/rclone.rs.
      - name: rclone
        run: |
          curl -fsSL -o rclone.deb https://github.com/rclone/rclone/releases/download/v1.76.0/rclone-v1.76.0-linux-amd64.deb
          echo "9db7ee9b725bce7cdd195b9183449a4c6fb93cad3e6578e70b87c0bc7f6062e9  rclone.deb" | sha256sum -c -
          sudo apt-get install -y ./rclone.deb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      # Checks Cargo.lock against the RustSec advisory database. A new advisory can fail an unrelated PR.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

      - name: Validate packaging metadata
        run: |
          appstreamcli validate --no-net packaging/io.github.evandro777.FastSync.metainfo.xml
          desktop-file-validate packaging/io.github.evandro777.FastSync.desktop

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev

      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --locked
