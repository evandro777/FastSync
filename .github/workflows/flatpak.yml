name: Flatpak

# Builds the Flatpak bundle on every push to master and on pull requests. On a version tag (v0.2.0, ...) it also
# publishes the signed Flatpak remote and the landing page to GitHub Pages, then attaches the bundle to the release.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.evandro777.FastSync

jobs:
  bundle:
    name: Build bundle
    runs-on: ubuntu-24.04
    # Flathub's CI image: the Freedesktop SDK 25.08 is preinstalled, so each run skips a ~1 GB download.
    # The tag must match runtime-version in flatpak/io.github.evandro777.FastSync.yml and the rust-stable lines below.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      FLATPAK_INSTALLATION: --system
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the version files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$version" = "$crate" ] || { echo "tag $version != Cargo.toml $crate"; exit 1; }
          grep -q "<release version=\"$version\"" packaging/$APP_ID.metainfo.xml \
            || { echo "metainfo has no <release> entry for $version"; exit 1; }

      # Its cargo also runs in the container (same SDK) and is used by build.sh to vendor the crates.
      - name: Rust SDK extension
        run: |
          flatpak install --system -y flathub org.freedesktop.Sdk.Extension.rust-stable//25.08
          echo /var/lib/flatpak/runtime/org.freedesktop.Sdk.Extension.rust-stable/x86_64/25.08/active/files/bin >> "$GITHUB_PATH"

      # Secrets are not available to PRs, so only tags sign. Without the key a tag build would publish an unsigned
      # remote that system-wide installs refuse, so it stops here instead.
      - name: Import signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          [ -f flatpak/signing-key.b64 ] || { echo "flatpak/signing-key.b64 is missing: run flatpak/new-signing-key.sh and commit it"; exit 1; }
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "secret FLATPAK_GPG_PRIVATE_KEY is not set (docs/FLATPAK-SIGNING.md)"; exit 1; }
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "FLATPAK_GPG_KEY=$(base64 -d flatpak/signing-key.b64 | gpg --show-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"

      - name: Build
        run: flatpak/build.sh --bundle

      - name: Name the bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || version="${GITHUB_SHA::8}"
          mv flatpak/fastsync.flatpak "FastSync-${version}-x86_64.flatpak"

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: flatpak-repo
          path: flatpak/repo
          include-hidden-files: true

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-x86_64
          path: |
            FastSync-*.flatpak

  # Own Flatpak remote on GitHub Pages (until Flathub accepts the app): `flatpak update` then works.
  # One-time setup (RELEASING.md): Settings -> Pages -> Source: GitHub Actions, and a `v*` tag rule on the
  # github-pages environment. The repo is signed with the key in flatpak/signing-key.b64 (private half: secret
  # FLATPAK_GPG_PRIVATE_KEY), so system-wide installs, which Mint's Update Manager needs, work.
  # Every deploy replaces the whole site, so the page only changes with a tag; never deploy it from master.
  pages:
    name: Publish Flatpak remote
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-repo
          path: site
      - name: Describe the remote
        run: |
          # Taken from GITHUB_REPOSITORY, not from the dedicated owner variable: prepare.sh rewrites that variable's name.
          account=${GITHUB_REPOSITORY%%/*}
          cat > site/fastsync.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=FastSync
          Url=https://${account,,}.github.io/${GITHUB_REPOSITORY#*/}/
          Homepage=https://github.com/${GITHUB_REPOSITORY}
          Comment=Light and fast Linux app
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          GPGKey=$(cat flatpak/signing-key.b64)
          EOF
          sed -i 's/^ *//' site/fastsync.flatpakrepo
          # The landing page and its screenshots live in the repo.
          cp docs/site/index.html site/
          cp packaging/io.github.evandro777.FastSync.svg site/icon.svg
          mkdir site/screenshots && cp docs/screenshots/*.png site/screenshots/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  # After the remote is live, so a release never announces a version `flatpak update` cannot fetch yet.
  release:
    name: Add to release
    needs: [bundle, pages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-x86_64
      # The AppImage workflow may get there first (or second): create the release only if it does not exist yet.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes || sleep 20
          gh release upload "$GITHUB_REF_NAME" FastSync-*.flatpak --repo "$GITHUB_REPOSITORY" --clobber
