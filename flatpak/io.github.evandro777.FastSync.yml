app-id: io.github.evandro777.FastSync
runtime: org.freedesktop.Platform
# Bump together with: the container image tag and the rust-stable lines in .github/workflows/flatpak.yml, and the
# header of flatpak/build.sh.
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: fastsync

# Wayland when available, otherwise X11; no GPU (software rendering). A sync app needs the network (rclone talks to
# the clouds and runs its OAuth callback on 127.0.0.1) and the user's folders (`--filesystem=home`: the synced
# folder is typed in, there is no portal for a folder that must stay readable and writable in the background).
# The tray needs the StatusNotifierWatcher.
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  # The official static rclone build: the transport and login layer. Checksums from
  # https://downloads.rclone.org/v1.76.0/SHA256SUMS. To update: new version in both URLs and both hashes.
  - name: rclone
    buildsystem: simple
    build-commands:
      - install -Dm755 rclone ${FLATPAK_DEST}/bin/rclone
    sources:
      - type: archive
        url: https://downloads.rclone.org/v1.76.0/rclone-v1.76.0-linux-amd64.zip
        sha256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
        only-arches: [x86_64]
        strip-components: 1
      - type: archive
        url: https://downloads.rclone.org/v1.76.0/rclone-v1.76.0-linux-arm64.zip
        sha256: ee169016675e23a69d77240565133ff7dbc9b33d16fa8f7053d4af39f1eaeb78
        only-arches: [aarch64]
        strip-components: 1

  - name: fastsync
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/fastsync/cargo
    build-commands:
      - cargo build --release --offline --locked
      - install -Dm755 target/release/fastsync ${FLATPAK_DEST}/bin/fastsync
      - install -Dm644 packaging/io.github.evandro777.FastSync.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/io.github.evandro777.FastSync.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 packaging/io.github.evandro777.FastSync.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      # A development build (app-id ...FastSync.Devel) must not collide with an installed release.
      - sed -i "s/io\\.github\\.evandro777\\.FastSync/${FLATPAK_ID}/g" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - case "${FLATPAK_ID}" in *.Devel) sed -i "s/^Name=FastSync$/Name=FastSync (Devel)/" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop ;; esac
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - dev
          - .claude
          - flatpak/build-dir
          - flatpak/devel
          - flatpak/.flatpak-builder
          - flatpak/repo
          - flatpak/vendor
          - flatpak/io.github.evandro777.FastSync.Devel.yml
          - flatpak/fastsync.flatpak
          - appimage/AppDir
          - squashfs-root
      # Crates are vendored by flatpak/build.sh, because the build runs without network access.
      - type: dir
        path: vendor
        dest: vendor
      - type: file
        path: cargo-config.toml
        dest: .cargo
        dest-filename: config.toml
