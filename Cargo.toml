[workspace]
members = ["crates/core", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.2.6"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/evandro777/FastSync"
rust-version = "1.92"
publish = false

[profile.release]
lto = "thin"
codegen-units = 4
# No `panic = "abort"`: the runner's `catch_unwind` (one account's panic shows as an error, the app and the other
# accounts keep going) does nothing under it.
strip = true
opt-level = 3

# Quick iteration: `cargo build --profile fast` (no LTO, parallel codegen).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
